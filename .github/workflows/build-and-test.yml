name: Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore MASA.PasswordGenerator.sln

    - name: Build Solution
      run: dotnet build MASA.PasswordGenerator.sln --configuration Release --no-restore

    - name: Run Unit Tests
      run: dotnet test MASA.PasswordGenerator.sln --configuration Release --no-build --verbosity normal
